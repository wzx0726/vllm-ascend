# ==========================================
# ACTUAL TEST CASES
# ==========================================

test_cases:
  - name: "DeepSeek-R1-0528-W8A8-MRV2-PCP-DCP"
    model: "vllm-ascend/DeepSeek-R1-0528-W8A8"
    envs:
      VLLM_USE_V2_MODEL_RUNNER: "1"
      VLLM_WORKER_MULTIPROC_METHOD: "spawn"
      OMP_NUM_THREADS: "10"
      OMP_PROC_BIND: "false"
      HCCL_BUFFSIZE: "1024"
      HCCL_OP_EXPANSION_MODE: "AIV"
      PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
      SERVER_PORT: "DEFAULT_PORT"
      VLLM_ENGINE_READY_TIMEOUT_S: "3000"
    server_cmd:
      - "--quantization"
      - "ascend"
      - "--data-parallel-size"
      - "1"
      - "--tensor-parallel-size"
      - "8"
      - "--prefill-context-parallel-size"
      - "2"
      - "--decode-context-parallel-size"
      - "16"
      - "--enable-expert-parallel"
      - "--port"
      - "$SERVER_PORT"
      - "--seed"
      - "1024"
      - "--max-model-len"
      - "36864"
      - "--max-num-batched-tokens"
      - "4096"
      - "--max-num-seqs"
      - "16"
      - "--trust-remote-code"
      - "--gpu-memory-utilization"
      - "0.9"
      - "--enable-chunked-prefill"
      - "--enable-prefix-caching"
      - "--async-scheduling"
      - "--speculative-config"
      - '{"num_speculative_tokens": 3, "method": "mtp"}'
      - "--compilation-config"
      - '{"cudagraph_mode": "FULL_DECODE_ONLY"}'
      - "--additional-config"
      - '{"weight_nz_mode": 1}'
    benchmarks:
      # Keep the accuracy baseline from DeepSeek-R1-0528-W8A8.yaml.
      acc:
        case_type: accuracy
        dataset_path: vllm-ascend/gsm8k-lite
        request_conf: vllm_api_general_chat
        dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_chat_prompt
        max_out_len: 32768
        batch_size: 32
        baseline: 95
        threshold: 10
